server {

        listen 443 ssl;
        server_name ruie.inami.gob.mx;
        server_tokens off;

        ssl_certificate     /etc/nginx/certs/ruie.inami.gob.mx.cer;
        ssl_certificate_key /etc/nginx/certs/ruie.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        client_max_body_size 100M;
        client_body_buffer_size 128k;

        location / {
                proxy_pass http://web:8000;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                proxy_read_timeout 120s;
                proxy_connect_timeout 120s;
                proxy_send_timeout 120s;
        }

        location /static/ {
                alias /src/backendRUIe/static/;
                add_header X-Content-Type-Options "nosniff" always;
        }

        location /media/ {
                alias /src/backendRUIe/media/;
                add_header X-Content-Type-Options "nosniff" always;
                add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'; object-src 'self' application/pdf; plugin-types application/pdf; sandbox" always;
        }

}

server {
        listen 80;
        server_name ruie.inami.gob.mx;
        server_tokens off;
        return 301 https://$host$request_uri;
}
