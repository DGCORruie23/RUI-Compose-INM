{% load static %}
{% for v in vehiculos %}
<a href="{% url 'vehiculos:detalle' v.placa %}" data-modal-url="{% url 'vehiculos:detalle_fragmento' v.placa %}"
   class="flex items-center justify-between gap-3 px-3 py-2 rounded-lg hover:bg-guinda-50 transition text-sm">
  <span class="font-semibold text-slate-700">{{ v.placa }}</span>
  <span class="text-slate-500 text-xs truncate">{{ v.marca }} {{ v.modelo }}</span>
</a>
{% empty %}
<p class="px-3 py-4 text-xs text-slate-400 text-center">Sin vehículos en esta categoría.</p>
{% endfor %}
{% if total > 8 %}
<a href="{% url 'vehiculos:listado' %}?{{ query }}"
   class="block text-center text-xs font-semibold text-guinda hover:underline px-3 py-2 border-t border-slate-100 mt-1">
  Ver los {{ total }} en el listado →
</a>
{% endif %}
