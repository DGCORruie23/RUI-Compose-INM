{% load static %}
<div class="max-w-4xl mx-auto">
  <div class="flex items-center justify-between mb-5">
    <div>
      <button type="button"
              onclick="window.VehiculosModal.abrir('{% url 'vehiculos:resumen_estado_fragmento' %}?estado={{ estado_inicial|urlencode }}')"
              class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-500 hover:text-[#9A0A38] transition mb-1">
        ← Regresar
      </button>
      <h2 class="text-2xl font-bold text-[#9A0A38]">Listado completo</h2>
    </div>
  </div>

  <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-2">
    <select id="modalFiltroTipo" onchange="window.filtrarListadoModal()"
            class="text-xs border border-slate-200 rounded-lg px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-[#9A0A38]">
      <option value="">Tipo: todos</option>
      {% for t in tipos_opciones %}<option value="{{ t }}">{{ t }}</option>{% endfor %}
    </select>
    <select id="modalFiltroSituacion" onchange="window.filtrarListadoModal()"
            class="text-xs border border-slate-200 rounded-lg px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-[#9A0A38]">
      <option value="">Situación: todas</option>
      {% for s in situacion_opciones %}<option value="{{ s }}">{{ s }}</option>{% endfor %}
    </select>
    <select id="modalFiltroAsignacion" onchange="window.filtrarListadoModal()"
            class="text-xs border border-slate-200 rounded-lg px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-[#9A0A38]">
      <option value="">Asignación: todas</option>
      {% for a in asignacion_opciones %}<option value="{{ a }}">{{ a }}</option>{% endfor %}
    </select>
    <select id="modalFiltroEstado" onchange="window.filtrarListadoModal()"
            class="text-xs border border-slate-200 rounded-lg px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-[#9A0A38]">
      <option value="">Estado: todos</option>
      {% for e in estado_opciones %}
      <option value="{{ e }}" {% if e == estado_inicial %}selected{% endif %}>{{ e }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="flex justify-end mb-4">
    <button type="button" onclick="window.limpiarFiltrosListadoModal()"
            class="text-xs font-semibold text-slate-500 hover:text-[#9A0A38] transition inline-flex items-center gap-1">
      ✕ Limpiar filtros
    </button>
  </div>

  <div class="border border-slate-100 rounded-xl overflow-hidden max-h-[55vh] overflow-y-auto">
    <table class="w-full text-sm">
      <thead class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wide sticky top-0">
        <tr>
          <th class="text-left px-3 py-2">Placa</th>
          <th class="text-left px-3 py-2">Marca / Modelo</th>
          <th class="text-left px-3 py-2">Tipo</th>
          <th class="text-left px-3 py-2">Situación</th>
          <th class="text-left px-3 py-2">Asignación</th>
          <th class="text-left px-3 py-2">Estado</th>
          <th class="px-3 py-2"></th>
        </tr>
      </thead>
      <tbody id="modalListadoTabla">
        {% include "vehiculos/_listado_filas.html" %}
      </tbody>
    </table>
  </div>
</div>
