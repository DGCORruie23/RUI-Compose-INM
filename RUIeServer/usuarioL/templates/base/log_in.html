{% extends "base/base.html" %}

{% block title %}Ingresa al sistema{% endblock title %}

{% block content %}
    {% comment %} <h1 class="text-xl">Ingresa al sistema</h1>

    <form action="." method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="py-1 px-3 mx-2 my-2 bg-teal-500 text-white rounded-xl">Ingresar</button>
    </form> {% endcomment %}

    <section class="grow w-full py-6 sm:py-10">
        <div class="flex flex-col items-center justify-center w-full px-4 sm:px-6 py-6 sm:py-8 mx-auto">
            <div class="bg-white/95 w-full max-w-md rounded-xl shadow-lg border border-gray-200">
                <div class="p-6 space-y-4 sm:p-8">
                    <h1  class="text-xl font-bold leading-tight tracking-tight text-[#10312B] md:text-2xl">
                        Ingresa al sistema
                    </h1>

                    <form class="space-y-4 md:space-y-6" action="." method="post">
                        {% csrf_token %}
                        <div>
                            <label for="email" class="block mb-2 text-sm font-medium text-gray-800">
                                    Nombre de Usuario
                            </label>
                            <input type="text" name="username" id="email" class="bg-white border border-gray-300 text-gray-900 text-sm 
                                    rounded-lg focus:ring-2 focus:ring-teal-600 focus:border-teal-600 block w-full p-3"required>
                        </div>
                        <div>
                            <label for="password" class="block mb-2 text-sm font-medium text-gray-800">Contraseña</label>
                            <input type="password" name="password" id="password" placeholder="••••••••" class="bg-white border border border-gray-300 text-gray-900 
                                    text-sm rounded-lg focus:ring-2 focus:border-teal-600 block w-full p-3" required>
                        </div>
                        
                        <button type="submit" class="w-full text-white bg-[#009688] hover:bg-[#00796B] focus:outline-none focus:ring-teal-300 font-medium rounded-lg 
                                    text-sm px-5 py-3 text-center transition-colors">
                                    Entra
                                    </button>
                    </form>
                </div>
            </div>
        </div>
      </section>
      
{% endblock content %}
